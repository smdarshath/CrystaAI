<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair with Crysta AI</title><link rel="stylesheet" href="/style.css"></head>
<body style="overflow:auto"><main class="sheet small" style="margin:8vh auto;display:block">
<h2>Pair this device</h2>
<p class="note">On the computer running Crysta open Devices → Create pairing code, then enter it here.</p>
<p><label>Pairing code<input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off"></label></p>
<p><label>Name for this device<input id="name" type="text" maxlength="40" value="My phone"></label></p>
<p><button id="go" class="btn primary" type="button">REQUEST PAIRING</button></p>
<p id="msg" class="note" role="status" aria-live="polite"></p>
</main><script type="module" src="/js/pair.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<title>CRYSTA AI</title>
<link rel="icon" href="/crysta.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/workspace.css">
</head>
<body>
<main id="home" aria-label="Crysta AI home screen">
  <div class="frame" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>

  <header class="top">
    <div class="brand"><span class="brand-name">CRYSTA AI</span><span class="brand-sub">LOCAL ASSISTANT</span></div>
    <ul class="chips" aria-label="System status">
      <li id="chip-net" class="chip">NET · …</li>
      <li id="chip-brain" class="chip">BRAIN · …</li>
      <li id="chip-mic" class="chip">MIC · …</li>
    </ul>
  </header>

  <aside class="side left" aria-label="Status readout">
    <div class="ro"><span>LINK</span><b id="ro-link">LOCAL</b></div>
    <div class="ro"><span>AGENTS</span><b id="ro-agents">—</b></div>
    <div class="ro"><span>MEMORY</span><b id="ro-mem">—</b></div>
    <div class="bar"><i></i></div>
    <div class="ro"><span>VOICE</span><b id="ro-voice">—</b></div>
    <div class="ro"><span>ACTIVITY</span><b id="ro-activity">IDLE</b></div>
    <div class="ro"><span>BACKEND RAM</span><b id="ro-rss">—</b></div>
  </aside>
  <aside class="side right" aria-label="Session readout">
    <div class="ro"><span>CLOCK</span><b id="ro-clock">--:--</b></div>
    <div class="ro"><span>UPTIME</span><b id="ro-up">—</b></div>
    <div class="ro"><span>LAST REPLY</span><b id="ro-lat">—</b></div>
    <div class="bar"><i></i></div>
    <div class="ro"><span>VERSION</span><b id="ro-ver">—</b></div>
  </aside>

  <section class="stage">
    <canvas id="orb" aria-hidden="true"></canvas>
    <div id="state-label" class="state-label">STANDBY</div>
  </section>

  <div id="caption" class="caption" role="status" aria-live="polite"></div>

  <footer class="bottom">
    <button id="mic" class="mic" type="button" aria-pressed="false" aria-label="Start voice input">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </button>
    <nav class="hud-nav" aria-label="Open an agent">
      <button type="button" data-open="zykron" class="n-zykron">ZYKRON</button>
      <button type="button" data-open="nova" class="n-nova">NOVA</button>
      <button type="button" data-open="astra" class="n-astra">ASTRA</button>
      <button type="button" data-open="vega" class="n-vega">VEGA</button>
      <button type="button" data-open="echo" class="n-echo">ECHO</button>
      <button type="button" data-open="nexus" class="n-nexus">NEXUS</button>
      <button type="button" data-open="orion" class="n-orion">ORION</button>
      <button type="button" data-open="volt" class="n-volt">VOLT</button>
      <button type="button" data-open="chat">CHAT</button>
      <button type="button" data-open="agents">ALL AGENTS</button>
      <button type="button" data-open="settings">SETTINGS</button>
    </nav>
    <div class="credit">Created by Arshath <span class="hint">· Space = talk · T = type · Esc = home</span></div>
  </footer>
</main>

<div id="workspace" class="workspace" hidden></div>

<div id="overlay" class="overlay" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head"><h2 id="sheet-title"></h2><button id="close" type="button" class="btn">◂ CRYSTA</button></header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
</div>

<div id="confirm" class="overlay confirm" hidden>
  <section class="sheet small" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <h2 id="confirm-title">Confirm action</h2>
    <p id="confirm-desc"></p>
    <p id="confirm-risk" class="risk"></p>
    <div class="row"><button id="confirm-no" type="button" class="btn">DENY</button><button id="confirm-yes" type="button" class="btn primary">APPROVE</button></div>
  </section>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
